<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Nexus Social</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; line-height: 1.6; }
    .container { max-width: 580px; margin: 40px auto; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
    .header { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); padding: 32px; text-align: center; color: #ffffff; }
    .header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .content { padding: 32px; }
    .content p { margin: 0 0 16px; font-size: 15px; color: #475569; }
    .button-wrap { text-align: center; margin: 32px 0; }
    .btn { display: inline-block; background: #6366f1; color: #ffffff !important; text-decoration: none; font-weight: 600; font-size: 15px; padding: 14px 32px; border-radius: 10px; }
    .footer { background: #f1f5f9; padding: 20px 32px; text-align: center; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Nexus Social</h1>
    </div>
    <div class="content">
      <p>Hello <strong>{{ username }}</strong>,</p>
      <p>Your email has been verified and your account is active! You can now join conversations, publish posts, engage with AI features, and connect with people across the network.</p>
      <div class="button-wrap">
        <a href="{{ feed_url }}" class="btn" target="_blank">Go to Feed</a>
      </div>
    </div>
    <div class="footer">
      &copy; Nexus Social &bull; Connect &amp; Share
    </div>
  </div>
</body>
</html>
