[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexus-social-backend"
version = "0.1.0"
description = "Nexus Social — FastAPI Backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "S101",    # assert in tests
    "S104",    # bind to 0.0.0.0 — acceptable for Docker
    "S105",    # false positive password variable detection
    "S106",    # false positive password argument detection
    "ANN401",  # Any is sometimes needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "F401"]
"scripts/*" = ["ANN", "S", "E501"]
"alembic/*" = ["ANN", "N999", "E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env = [
    "ENVIRONMENT=test",
    "DATABASE_URL=sqlite+aiosqlite:///:memory:",
    "JWT_SECRET=test_jwt_secret_must_be_at_least_32_chars_long_for_pydantic",
    "GEMINI_API_KEY=test_gemini_api_key_placeholder",
    "ADMIN_EMAIL=admin@example.com",
    "ADMIN_USERNAME=admin",
    "ADMIN_PASSWORD=AdminTestPassword123!",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
