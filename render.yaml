# =========================================================================
# Render Infrastructure Blueprint — Nexus Social Platform
# =========================================================================
# Automatically provisions:
#   1. Managed PostgreSQL database (Render free/starter tier)
#   2. Docker Web Service running FastAPI with automatic migrations
# =========================================================================

services:
  - type: web
    name: nexus-social-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    preDeployCommand: "alembic upgrade head"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-social-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: FRONTEND_URL
        sync: false  # Set to Vercel deployment URL (e.g. https://nexus-social.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false  # Comma-separated allowlist, e.g. https://nexus-social.vercel.app
      # ── Brevo / Standard SMTP Configuration ──
      - key: SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false  # Registered Brevo account login email
      - key: SMTP_PASSWORD
        sync: false  # Brevo SMTP Master Key / API key
      - key: SMTP_FROM_EMAIL
        sync: false  # Verified sender email in Brevo dashboard
      - key: SMTP_FROM_NAME
        value: "Nexus Social"
      - key: SMTP_USE_TLS
        value: "true"
      # ── Gemini 2.5 Flash AI Engine ──
      - key: GEMINI_API_KEY
        sync: false  # Google AI Studio Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_QUOTA
        value: "100"
      - key: MODERATION_FAIL_MODE
        value: open
      # ── Initial Admin Account ──
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      # ── Optional Monitoring ──
      - key: SENTRY_DSN
        sync: false

databases:
  - name: nexus-social-db
    plan: free
    region: oregon
    databaseName: nexussocial
    user: nexussocial
