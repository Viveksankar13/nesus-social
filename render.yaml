# =========================================================================
# Render Infrastructure Blueprint — Nexus Social Platform
# =========================================================================
# Automatically provisions:
#   1. Managed PostgreSQL database (Render free/starter tier)
#   2. Docker Web Service running FastAPI with automatic migrations
# =========================================================================

services:
  - type: web
    name: nexus-social-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    # Note: Alembic migrations run automatically on container startup via entrypoint.sh.
    # preDeployCommand is supported only on paid plans; entrypoint.sh works on both free and paid tiers.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-social-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: FRONTEND_URL
        sync: false  # Set to Vercel deployment URL (e.g. https://nexus-social.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false  # Comma-separated allowlist, e.g. https://nexus-social.vercel.app
      # ── Brevo / Standard SMTP Configuration ──
      - key: SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false  # Registered Brevo account login email
      - key: SMTP_PASSWORD
        sync: false  # Brevo SMTP Master Key / API key
      - key: SMTP_FROM_EMAIL
        sync: false  # Verified sender email in Brevo dashboard
      - key: SMTP_FROM_NAME
        value: "Nexus Social"
      - key: SMTP_USE_TLS
        value: "true"
      # ── Gemini 2.5 Flash AI Engine ──
      - key: GEMINI_API_KEY
        sync: false  # Google AI Studio Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_QUOTA
        value: "100"
      - key: MODERATION_FAIL_MODE
        value: open
      # ── Initial Admin Account ──
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      # ── Optional Monitoring ──
      - key: SENTRY_DSN
        sync: false
      # ── Supabase Cloud Storage (Optional permanent storage) ──
      - key: SUPABASE_URL
        sync: false  # e.g. https://xyz.supabase.co
      - key: SUPABASE_KEY
        sync: false  # Service role key or anon key with storage permissions
      - key: SUPABASE_BUCKET
        value: "nexus-media"
      # ── Hyper-Local Skill Swap Economy ──
      - key: CRON_SECRET
        generateValue: true
      - key: JITSI_BASE_URL
        value: "https://meet.jit.si"
      - key: SWAP_SESSION_MINUTES
        value: "30"
      - key: SWAP_MAX_ACTIVE_LISTINGS
        value: "5"
      - key: SWAP_MAX_PENDING_REQUESTS
        value: "5"
      - key: MATCH_WEIGHT_SKILL
        value: "0.35"
      - key: MATCH_WEIGHT_PROXIMITY
        value: "0.25"
      - key: MATCH_WEIGHT_AVAILABILITY
        value: "0.20"
      - key: MATCH_WEIGHT_TRUST
        value: "0.15"
      - key: MATCH_WEIGHT_FRESHNESS
        value: "0.05"

  # ── Skill Swap Cron Jobs (Note: Render native cron requires paid compute) ──
  # For free tier, schedule via cron-job.org or GitHub Actions targeting /api/v1/internal/jobs/*
  # - type: cron
  #   name: swap-reminders-job
  #   plan: starter
  #   region: oregon
  #   schedule: "*/15 * * * *"
  #   command: "curl -fsS -X POST -H 'X-Cron-Secret: '$CRON_SECRET http://nexus-social-backend:8000/api/v1/internal/jobs/send-session-reminders || true"
  #
  # - type: cron
  #   name: swap-auto-expiry-job
  #   plan: starter
  #   region: oregon
  #   schedule: "0 * * * *"
  #   command: "curl -fsS -X POST -H 'X-Cron-Secret: '$CRON_SECRET http://nexus-social-backend:8000/api/v1/internal/jobs/auto-expire-requests || true"
  #
  # - type: cron
  #   name: swap-reviews-and-trust-job
  #   plan: starter
  #   region: oregon
  #   schedule: "0 2 * * *"
  #   command: "curl -fsS -X POST -H 'X-Cron-Secret: '$CRON_SECRET http://nexus-social-backend:8000/api/v1/internal/jobs/reveal-swap-reviews && curl -fsS -X POST -H 'X-Cron-Secret: '$CRON_SECRET http://nexus-social-backend:8000/api/v1/internal/jobs/recalculate-trust-scores || true"

databases:
  - name: nexus-social-db
    plan: free
    region: oregon
    databaseName: nexussocial
    user: nexussocial
