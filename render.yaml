# ===========================
# Render Blueprint – AI Social Media Platform
# Deploys: FastAPI backend (Docker) + Managed PostgreSQL
# ===========================
services:
  - type: web
    name: socialmedia-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socialmedia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: FRONTEND_URL
        sync: false  # Set in Render dashboard after Vercel deploy
      - key: ALLOWED_ORIGINS
        sync: false  # Set in Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Nexus Social"
      - key: SMTP_USE_TLS
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MODERATION_FAIL_MODE
        value: open
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_DAILY_QUOTA
        value: "100"
    healthCheckPath: /health
    buildCommand: ""
    startCommand: ""

databases:
  - name: socialmedia-db
    plan: free
    region: oregon
    databaseName: socialmedia
    user: socialmedia
